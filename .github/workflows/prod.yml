name: Innerpeace CICD Pipeline

on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # withought docker CI pipeline Start
      # ------------------------------------------------
      # - name: Setup Node
      #   uses: actions/setup-node@v7
      #   with:
      #       node-version: 20
      #       cache: npm
      #       cache-dependency-path: innerpeace-app/package-lock.json

      # - name: Install Dependencies
      #   working-directory: innerpeace-app
      #   run: npm i

      # - name: Run lint
      #   working-directory: innerpeace-app
      #   run: npm run lint

      # - name: Run test
      #   working-directory: innerpeace-app
      #   run: npm test -- --watchAll=false

      # - name: Build application
      #   working-directory: innerpeace-app
      #   run: npm run build
      # -------------------------------------
      # withought docker CI pipeline End

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/aug-cicd:${{ github.sha }} .

      - name: Check Docker Image
        run: |
          docker images
          docker image inspect docker.io/${{ secrets.DOCKER_USERNAME }}/aug-cicd:${{ github.sha }}

      - name: Test Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'docker.io/${{ secrets.DOCKER_USERNAME }}/aug-cicd:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Docker Image
        run: |
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/aug-cicd:${{ github.sha }}

